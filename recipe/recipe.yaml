schema_version: 1

context:
  name: mujoco-warp
  version: "3.9.0.1"
  build_number: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mujoco_warp-${{ version }}.tar.gz
  sha256: f6efacb2ac23041d34cee5208c6c95b4b34a071c8b5df5e223aa7a48a7aac431

build:
  noarch: python
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mjwarp-testspeed = mujoco_warp.testspeed:main
      - mjwarp-viewer = mujoco_warp.viewer:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - absl-py
    - mujoco >=3.8.0
    - numpy
    - python >=${{ python_min }}
    - warp-lang >=1.12
    # etils[epath] dependencies.
    # https://github.com/google/etils/blob/main/pyproject.toml
    - etils
    - fsspec
    - typing-extensions
    - zipp

tests:
  - python:
      imports:
        - mujoco_warp
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      # The mujoco_warp package bundles the tests in the package, so we can run them from there.
      - if: not win
        then:
          - which mjwarp-testspeed
          - which mjwarp-viewer
          - pytest --pyargs mujoco_warp
        else:
          - where mjwarp-testspeed
          - where mjwarp-viewer
          - pytest --pyargs mujoco_warp -k "not test_collision20"
    files:
      source:
        - pyproject.toml
    requirements:
      run:
        - pip
        - pytest
        - python ${{ python_min }}.*
        - scipy

about:
  documentation: https://mujoco.readthedocs.io
  homepage: https://github.com/google-deepmind/mujoco_warp
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/google-deepmind/mujoco_warp
  summary: GPU-optimized version of the MuJoCo physics simulator, designed for NVIDIA hardware.

extra:
  recipe-maintainers:
    - diegoferigo
    - oursland
    - traversaro
